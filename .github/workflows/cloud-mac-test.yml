name: Toolchain Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  toolchain-check:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show system details
        run: |
          echo "=== SYSTEM ==="
          sw_vers
          uname -a
          uname -m

      - name: Show Xcode and SDKs
        run: |
          echo "=== XCODE ==="
          xcodebuild -version
          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== macOS SDK ==="
          xcrun --sdk macosx --show-sdk-version

      - name: Check required tools
        run: |
          echo "=== TOOLS ==="
          for tool in xcrun xcodebuild clang codesign lipo otool install_name_tool vtool; do
            echo "--- $tool ---"
            command -v "$tool" || true
          done

      - name: Validate parser tests
        run: |
          python3 --version
          python3 -m pip install pytest
          pytest -q tests/test_macho_parser.py

      - name: Inspect repository structure
        run: |
          echo "=== REPO ==="
          find . -maxdepth 3 -type f | sort | head -200
